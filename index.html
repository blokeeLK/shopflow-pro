  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const mensagemGabriela = "O⁬⁭⁬⁭⁬⁭⁬⁭lá, Gabriela! Quero saber mais informações sobre o atacado.";
        const mensagemGuilherme = "O⁬⁭⁬⁭⁬⁭⁬⁭lá, Guilherme! Quero saber mais informações sobre o atacado.";

        function atualizarTextoWhatsApp(link, mensagem) {
          if (!link || !link.href) return;

          try {
            const url = new URL(link.href);
            url.searchParams.set("text", mensagem);
            link.href = url.toString();
          } catch (error) {
            if (link.href.includes("?")) {
              link.href = link.href.replace(/([?&])text=[^&]*/i, "$1text=" + encodeURIComponent(mensagem));
            } else {
              link.href = link.href + "?text=" + encodeURIComponent(mensagem);
            }
          }
        }

        function atualizarPagina() {
          const botoesVendedores = Array.from(document.querySelectorAll("a, button, [role='button']"))
            .filter(function (elemento) {
              const texto = elemento.textContent.trim();
              return texto.includes("Vendedor") || texto.includes("Vendedora");
            });

          botoesVendedores.forEach(function (elemento, index) {
            const posicaoNoBloco = index % 2;

            if (posicaoNoBloco === 0) {
              elemento.textContent = "Vendedora Gabriela";

              if (elemento.tagName.toLowerCase() === "a") {
                atualizarTextoWhatsApp(elemento, mensagemGabriela);
              }
            }

            if (posicaoNoBloco === 1) {
              elemento.textContent = "Vendedor Guilherme";

              if (elemento.tagName.toLowerCase() === "a") {
                atualizarTextoWhatsApp(elemento, mensagemGuilherme);
              }
            }
          });
        }

        atualizarPagina();

        const observer = new MutationObserver(function () {
          atualizarPagina();
        });

        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
      });
    </script>
  </body>
